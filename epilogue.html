<style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --ph-main: #00ff41;   
            --ph-bright: #aaffaa; 
            --bg-color: #000200;  
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-touch-callout: none; scrollbar-width: none; }
        ::-webkit-scrollbar { display: none; width: 0; height: 0; }

        body, html { 
            background: var(--bg-color); color: var(--ph-main); 
            font-family: 'VT323', monospace; height: 100vh; height: 100dvh; width: 100vw; 
            overflow: hidden; display: flex; flex-direction: column; overscroll-behavior: none;
        }

        .scanline { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(to bottom, transparent, rgba(0, 255, 65, 0.08) 50%, transparent); height: 25px; animation: scanline-move 8s linear infinite; z-index: 9998; }
        @keyframes scanline-move { 0% { top: -100px; } 100% { top: 100vh; } }
        .crt-layer { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.85) 100%); z-index: 9997; }

        #start-overlay {
            position: absolute; inset: 0; z-index: 9000; background: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer;
        }
        .blink-text { font-size: clamp(1.5rem, 4vw, 2.5rem); animation: blink 1.5s infinite; text-shadow: 0 0 15px var(--ph-main); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* =========================================
           SCENA CENTRALE 3D E BRAND
           ========================================= */
        #fin_center-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 50; width: 100%; }
        .scene-3d { width: 120px; height: 120px; perspective: 800px; margin-bottom: 40px; display: flex; justify-content: center; align-items: center; }
        .cube-spinner { width: 80px; height: 80px; position: relative; transform-style: preserve-3d; animation: fin-spin-cube 8s linear infinite; }
        
        .cube-face { position: absolute; width: 80px; height: 80px; border: 1px solid var(--ph-main); background: rgba(0, 255, 65, 0.1); box-shadow: inset 0 0 10px rgba(0,255,65,0.3); }
        .cube-face.front { transform: rotateY(0deg) translateZ(40px); }
        .cube-face.back { transform: rotateY(180deg) translateZ(40px); }
        .cube-face.right { transform: rotateY(90deg) translateZ(40px); }
        .cube-face.left { transform: rotateY(-90deg) translateZ(40px); }
        .cube-face.top { transform: rotateX(90deg) translateZ(40px); }
        .cube-face.bottom { transform: rotateX(-90deg) translateZ(40px); }

        .inner-pyramid { position: absolute; top: 20px; left: 20px; width: 40px; height: 40px; transform-style: preserve-3d; animation: fin-spin-pyr 4s linear infinite reverse; }
        .pyr-face { position: absolute; width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 40px solid rgba(0, 255, 65, 0.3); transform-origin: bottom center; }
        .pyr-face.p-front { transform: rotateY(0deg) translateZ(10px) rotateX(30deg); }
        .pyr-face.p-back { transform: rotateY(180deg) translateZ(10px) rotateX(30deg); }
        .pyr-face.p-right { transform: rotateY(90deg) translateZ(10px) rotateX(30deg); }
        .pyr-face.p-left { transform: rotateY(-90deg) translateZ(10px) rotateX(30deg); }
        
        @keyframes fin-spin-cube { 0% { transform: rotateX(0deg) rotateY(0deg); } 100% { transform: rotateX(360deg) rotateY(720deg); } }
        @keyframes fin-spin-pyr { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }

        #fin_brand-text { font-size: clamp(1.8rem, 5vw, 3.5rem); letter-spacing: clamp(2px, 1vw, 6px); font-weight: bold; text-align: center; text-shadow: 0 0 20px var(--ph-main); }
        
        .explode-anim { animation: explode-out-anim 0.8s cubic-bezier(0.1, 0.8, 0.2, 1) forwards; }
        @keyframes explode-out-anim { 
            0% { transform: translate(-50%, -50%) scale(1) translateZ(0); opacity: 1; filter: blur(0px); } 
            100% { transform: translate(-50%, -50%) scale(5) translateZ(300px) rotate(20deg); opacity: 0; filter: blur(10px); } 
        }

        /* =========================================
           TOTEM 3D E TESTI 
           ========================================= */
        #fin_totem-stage { position: absolute; top: 50%; left: 50%; width: 0; height: 0; display: flex; justify-content: center; align-items: center; perspective: 1200px; z-index: 60; transform: translate(-50%, -50%) scale(1); transition: transform 2.5s cubic-bezier(0.25, 1, 0.3, 1); }
        #fin_totem-spinner { position: relative; width: 0; height: 0; transform-style: preserve-3d; transition: transform 2s ease; }
        
        .totem-element { position: absolute; width: clamp(280px, 80vw, 400px); height: auto; left: calc(clamp(280px, 80vw, 400px) / -2); top: -20px; display: flex; justify-content: center; align-items: center; text-align: center; font-size: clamp(1rem, 3.5vw, 1.6rem); line-height: 1.2; color: var(--ph-bright); text-shadow: 0 0 10px var(--ph-main); transform-style: preserve-3d; transition: all 2s cubic-bezier(0.25, 1, 0.3, 1); padding: 10px; }
        
        .flat-pos-1 { transform: translateY(-70px); opacity: 0; }
        .flat-pos-2 { transform: translateY(0px); opacity: 0; }
        .flat-pos-3 { transform: translateY(70px); opacity: 0; }
        .clone { opacity: 0 !important; pointer-events: none; }

        /* Morphing nel Cubo-Piramide finale */
        #fin_totem-stage.morph { transform: translate(-50%, -50%) translateY(-28vh) scale(0.65); }
        #fin_totem-stage.morph #fin_totem-spinner { animation: fin-spin-totem 12s linear infinite; }
        #fin_totem-stage.morph .totem-element { border: 2px solid var(--ph-main); box-shadow: inset 0 0 30px rgba(0,255,65,0.2), 0 0 20px rgba(0,255,65,0.4); background: rgba(0, 15, 0, 0.95); height: clamp(280px, 80vw, 400px); top: calc(clamp(280px, 80vw, 400px) / -2); opacity: 1 !important; }
        
        #fin_totem-stage.morph .cube-front { transform: rotateY(0deg) translateZ(calc(clamp(280px, 80vw, 400px) / 2)); }
        #fin_totem-stage.morph .cube-back  { transform: rotateY(180deg) translateZ(calc(clamp(280px, 80vw, 400px) / 2)); }
        #fin_totem-stage.morph .cube-left  { transform: rotateY(-90deg) translateZ(calc(clamp(280px, 80vw, 400px) / 2)); }
        #fin_totem-stage.morph .cube-right { transform: rotateY(90deg) translateZ(calc(clamp(280px, 80vw, 400px) / 2)); }
        
        #fin_totem-stage.morph .pyr { height: clamp(200px, 60vw, 280px); width: clamp(200px, 60vw, 280px); left: calc(clamp(200px, 60vw, 280px) / -2); top: calc(clamp(200px, 60vw, 280px) / -2); transform-origin: bottom center; border-color: var(--ph-bright); color: #fff; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); padding-top: 50px; background: transparent; box-shadow: none;}
        #fin_totem-stage.morph .pyr-front { transform: translateY(40px) rotateY(0deg) translateZ(60px) rotateX(30deg); border-bottom: 2px solid var(--ph-bright);}
        #fin_totem-stage.morph .pyr-back  { transform: translateY(40px) rotateY(180deg) translateZ(60px) rotateX(30deg); border-bottom: 2px solid var(--ph-bright);}
        #fin_totem-stage.morph .pyr-left  { transform: translateY(40px) rotateY(-90deg) translateZ(60px) rotateX(30deg); border-bottom: 2px solid var(--ph-bright);}
        #fin_totem-stage.morph .pyr-right { transform: translateY(40px) rotateY(90deg) translateZ(60px) rotateX(30deg); border-bottom: 2px solid var(--ph-bright);}

        @keyframes fin-spin-totem { 0% { transform: rotateX(-15deg) rotateY(0deg); } 100% { transform: rotateX(-15deg) rotateY(360deg); } }

        /* Credits Scroll */
        #fin_credits-container { position: absolute; top: 50vh; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; align-items: flex-start; padding: 0 clamp(20px, 5vw, 50px); z-index: 40; overflow-y: auto; }
        .credits-wrapper { width: 100%; max-width: 900px; margin: 0 auto; padding-bottom: 60px; }
        #fin_credits-text { font-size: clamp(1.1rem, 3vw, 1.8rem); line-height: 1.4; text-align: left; text-shadow: 0 0 10px var(--ph-main); }
        #fin_cursor { display: none; width: clamp(10px, 2.5vw, 15px); height: 1em; background: var(--ph-main); margin-left: 5px; vertical-align: bottom; }
        
    </style>

            <div class="totem-element flat-pos-2 cube-left" id="fin_totem-2"></div>

    <!-- Contenitore Titoli di Coda -->
    <div id="fin_credits-container">

    <script>
        "use strict";
	if (typeof AOE_PROGRESS !== 'undefined' && !AOE_PROGRESS.isCoreUnlocked()) {
            window.location.href = 'hub_system.html';
           
        }
        // ==========================================
        // AUDIO ENGINE
        // ==========================================
        let audioCtx;
        function initGlobalAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        const sysAudio = {
            playTone(freq, type, duration, vol = 0.1, glideFreq = null) {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type; 
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    if(glideFreq) osc.frequency.exponentialRampToValueAtTime(glideFreq, audioCtx.currentTime + duration);
                    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + duration);
                } catch(e) {}
            },
            noise(duration, vol = 0.1) {
                if(!audioCtx) return;
                try {
                    const bufferSize = audioCtx.sampleRate * duration;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                    noise.connect(gain); gain.connect(audioCtx.destination);
                    noise.start();
                } catch(e) {}
            },
            type() { this.playTone(Math.random() * 200 + 1200, 'square', 0.02, 0.05); },
            explode() { this.noise(1.5, 0.4); this.playTone(80, 'sawtooth', 1.5, 0.5, 20); }
        };

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        // ==========================================
        // TESTI MULTILINGUA
        // ==========================================
        const I18N = {
            it: {
                manifesto: ["IL SISTEMA OSSERVA MA NON REGISTRA.", "LA PRIVACY È LOCALE, LA PRESENZA È GLOBALE.", "LA LIBERTÀ È NEL CODICE CHE NON DIPENDE DA NULLA."],
                credits: [
                    "VITTORIA: ACCESSO AL NUCLEO GARANTITO.", 
                    "GRAZIE PER AVER ESPLORATO QUESTO ARCHIVIO.", 
                    "QUESTA ESPERIENZA E I GIOCHI AL SUO INTERNO SONO UN TRIBUTO ALLA VISIONE DI GEORGE ORWELL E ALLA SUA OPERA FONDAMENTALE.", 
                    "SE NON L'HAI ANCORA FATTO, TI INVITO A LEGGERE '1984'.", 
                    "LA CONSAPEVOLEZZA È LA TUA VERA ARMA.", 
                    "SISTEMA CREATO DA THEOLDSMOKEARCADE1984",
                    "FINE DELLA TRASMISSIONE."
                ],
                clickText: "> TRASMISSIONE IN INGRESSO... [ CLICCA PER APRIRE ]"
            },
            en: {
                manifesto: ["THE SYSTEM WATCHES BUT DOES NOT RECORD.", "PRIVACY IS LOCAL, PRESENCE IS GLOBAL.", "FREEDOM IS IN CODE THAT DEPENDS ON NOTHING."],
                credits: [
                    "VICTORY: CORE ACCESS GRANTED.", 
                    "THANK YOU FOR EXPLORING THIS ARCHIVE.", 
                    "THIS EXPERIENCE AND ITS GAMES ARE A TRIBUTE TO GEORGE ORWELL'S VISION AND HIS FUNDAMENTAL WORK.", 
                    "IF YOU HAVEN'T ALREADY, I INVITE YOU TO READ '1984'.", 
                    "AWARENESS IS YOUR TRUE WEAPON.", 
                    "SYSTEM CREATED BY THEOLDSMOKEARCADE1984",
                    "END OF TRANSMISSION."
                ],
                clickText: "> INCOMING TRANSMISSION... [ CLICK TO OPEN ]"
            }
        };

        const globalLang = AOE_PROGRESS.getLang(Object.keys(I18N));
        const t = I18N[globalLang] || I18N['en'];

        // Applica testo lingua pulsante di avvio
        document.querySelector('.blink-text').textContent = t.clickText;

        // ==========================================
        // LOGICA CINEMATICA
        // ==========================================
        async function typeElement(id, text) {
            const el = document.getElementById(id);
            el.style.opacity = '1';
            for (let i = 0; i < text.length; i++) {
                el.innerHTML += text.charAt(i);
                if (text.charAt(i) !== ' ') sysAudio.type();
                await sleep(35);
            }
        }

        async function startEpilogue() {
            initGlobalAudio();
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('fin_center-stage').style.display = 'flex';
            
            // Attesa drammatica prima dell'esplosione
            await sleep(2500);

            sysAudio.explode();
            document.getElementById('fin_center-stage').classList.add('explode-anim');
            
            await sleep(600);
            document.getElementById('fin_center-stage').style.display = 'none';

            // Costruzione Manifesto Totem
            const mTexts = t.manifesto;
            await typeElement('fin_totem-1', mTexts[0]); await sleep(400);
            await typeElement('fin_totem-2', mTexts[1]); await sleep(400);
            await typeElement('fin_totem-3', mTexts[2]); await sleep(1000);

            // Copia i testi nei cloni per le facce del cubo/piramide
            document.getElementById('fin_t-clone-1a').innerHTML = mTexts[0];
            document.getElementById('fin_t-clone-2a').innerHTML = mTexts[1];
            document.getElementById('fin_t-clone-3a').innerHTML = mTexts[2];
            document.getElementById('fin_t-clone-3b').innerHTML = mTexts[2];
            document.getElementById('fin_t-clone-3c').innerHTML = mTexts[2];

            // Inizia Morphing in 3D
            sysAudio.playTone(300, 'sine', 2.0, 0.1, 800);
            document.getElementById('fin_totem-stage').classList.add('morph');
            
            await sleep(2500);

            // Inizia Titoli di Coda
            document.getElementById('fin_credits-container').style.display = 'flex';
            document.getElementById('fin_cursor').style.display = 'inline-block';
            
            const lines = t.credits;
            const output = document.getElementById('fin_credits-text');
            const container = document.getElementById('fin_credits-container');
            
            for(let line of lines) {
                for (let i = 0; i < line.length; i++) {
                    output.innerHTML += line.charAt(i);
                    if (line.charAt(i) !== ' ') sysAudio.type();
                    await sleep(35); 
                }
                await sleep(800); 
                output.innerHTML += '<br><br>'; 
                container.scrollTop = container.scrollHeight;
            }

            sysAudio.playTone(800, 'square', 1.0, 0.1);
            document.getElementById('fin_cursor').style.display = 'none';
        }
    </script>

    <script>
        const I18N = {
            it: { narrative: ["INIZIALIZZAZIONE PROTOCOLLO...", "DOVRAI ATTRAVERSARE I 12 NODI DELL'ARCADE.", "DOVRAI SUPERARE IL PERCORSO DEL CAVALIERE.", "INFILTRERAI LA RETE COME SPETTRO NEON.", "INGANNERAI L'IA LOCALE NEL SETTORE ZERO.", "SOLO ALLORA RAGGIUNGERAI IL NUCLEO: IL TESSERATTO 3X3X3.", "MA ATTENZIONE: IL SISTEMA TI CERCHERÀ.", "SARAI IL VIRUS (RE ♚).", "OBIETTIVO: ALLINEARE 3 CORE PER FORZARE L'OVERRIDE.", "EVITA LA SICUREZZA (ALFIERE ♝): HACKERERÀ LA MATRICE PER RAGGIUNGERTI.", "CONTROLLI: CLICCA I CUBI ADIACENTI PER MUOVERTI. TRASCINA PER RUOTARE.", "PREPARAZIONE AL CARICAMENTO..."] },
            en: { narrative: ["PROTOCOL INITIALIZATION...", "YOU MUST CROSS THE 12 NODES OF THE ARCADE.", "YOU MUST SURVIVE THE KNIGHT'S TOUR.", "YOU WILL INFILTRATE THE NETWORK AS A NEON SPECTER.", "YOU WILL OUTSMART THE LOCAL AI IN SECTOR ZERO.", "ONLY THEN WILL YOU REACH THE CORE: THE 3X3X3 TESSERACT.", "BUT BEWARE: THE SYSTEM WILL HUNT YOU.", "YOU WILL BE THE VIRUS (KING ♚).", "OBJECTIVE: ALIGN 3 CORES TO FORCE THE OVERRIDE.", "EVADE SECURITY (BISHOP ♝): HE WILL HACK THE MATRIX TO REACH YOU.", "CONTROLS: CLICK ADJACENT CUBES TO MOVE. DRAG TO ROTATE.", "PREPARING TO LOAD..."] },
            es: { narrative: ["INICIALIZACIÓN DEL PROTOCOLO...", "DEBERÁS CRUZAR LOS 12 NODOS DEL ARCADE.", "DEBERÁS SOBREVIVIR AL TOUR DEL CABALLO.", "TE INFILTRARÁS EN LA RED COMO UN ESPECTRO NEÓN.", "ENGAÑARÁS A LA IA LOCAL EN EL SECTOR CERO.", "SOLO ENTONCES LLEGARÁS AL NÚCLEO: EL TESERACTO 3X3X3.", "PERO CUIDADO: EL SISTEMA TE BUSCARÁ.", "SERÁS EL VIRUS (REY ♚).", "OBJETIVO: ALINEA 3 CORES PARA FORZAR LA ANULACIÓN.", "EVITA LA SEGURIDAD (ALFIL ♝): HACKEARÁ LA MATRIZ PARA ALCANZARTE.", "CONTROLES: TOCA LOS CUBOS ADYACENTES PARA MOVERTE. ARRASTRA PARA ROTAR.", "PREPARANDO CARGA..."] },
            fr: { narrative: ["INITIALISATION DU PROTOCOLE...", "VOUS DEVREZ TRAVERSER LES 12 NŒUDS DE L'ARCADE.", "VOUS DEVREZ SURVIVRE AU TOUR DU CAVALIER.", "VOUS INFILTREREZ LE RÉSEAU COMME UN SPECTRE NÉON.", "VOUS TROMPEREZ L'IA LOCALE DANS LE SECTEUR ZÉRO.", "ALORS SEULEMENT VOUS ATTEINDREZ LE NOYAU : LE TESSERACT 3X3X3.", "MAIS ATTENTION : LE SYSTÈME VOUS CHERCHERA.", "VOUS SEREZ LE VIRUS (ROI ♚).", "OBJECTIF : ALIGNEZ 3 CORES POUR FORCER LE DÉPASSEMENT.", "ÉVITEZ LA SÉCURITÉ (FOU ♝) : IL PIRATERA LA MATRICE POUR VOUS ATTEINDRE.", "CONTRÔLES : CLIQUEZ SUR LES CUBES ADJACENTS POUR VOUS DÉPLACER. GLISSEZ POUR PIVOTER.", "PRÉPARATION AU CHARGEMENT..."] },
            de: { narrative: ["PROTOKOLL-INITIALISIERUNG...", "DU MUSST DIE 12 KNOTEN DER ARCADE DURCHQUEREN.", "DU MUSST DIE SPRINGER-TOUR ÜBERLEBEN.", "DU WIRST DAS NETZWERK ALS NEON-GESPENST INFILTRIEREN.", "DU WIRST DIE LOKALE KI IN SEKTOR NULL ÜBERLISTEN.", "ERST DANN ERREICHST DU DEN KERN: DEN 3X3X3 TESSERAKT.", "ABER VORSICHT: DAS SYSTEM WIRD DICH JAGEN.", "DU WIRST DER VIRUS SEIN (KÖNIG ♚).", "ZIEL: RICHTE 3 CORES AUS, UM DEN OVERRIDE ZU ERZWINGEN.", "MEIDE DIE SICHERHEIT (LÄUFER ♝): ER WIRD DIE MATRIX HACKEN, UM DICH ZU ERREICHEN.", "STEUERUNG: KLICKE AUF BENACHBARTE WÜRFEL ZUM BEWEGEN. ZIEHE ZUM DREHEN.", "LADEVORGANG WIRD VORBEREITET..."] },
            ja: { narrative: ["プロトコル初期化中...", "アーケードの12のノードを通過しなければならない。", "騎士の巡回を生き延びなければならない。", "ネオンスペクターとしてネットワークに潜入するのだ。", "セクターゼロでローカルAIを出し抜け。", "その後、ついにコアに到達する：3X3X3のテッセラクトだ。", "しかし注意しろ：システムはあなたを追跡する。", "あなたはウイルス（キング♚）となる。", "目的：3つのコアを揃えてオーバーライドを強制しろ。", "セキュリティ（ビショップ♝）を避けろ：奴はマトリックスをハックして追ってくる。", "操作：隣接するキューブをタップして移動。ドラッグして回転。", "ロードの準備中..."] },
            zh: { narrative: ["协议初始化中...", "你必须穿过街机的 12 个节点。", "你必须在骑士巡游中幸存下来。", "你将作为霓虹幽灵潜入网络。", "你将在零扇区智胜本地 AI。", "只有这样，你才能到达核心：3X3X3 超立方体。", "但要当心：系统会追捕你。", "你将成为病毒（国王 ♚）。", "目标：对齐 3 个核心以强制覆盖。", "避开安全系统（主教 ♝）：他会黑入矩阵来抓捕你。", "控制：点击相邻的方块移动。拖动以旋转。", "准备加载..."] }
        };

        let currentLang = AOE_PROGRESS.getLang(Object.keys(I18N));
        
        let isSkipped = false;
        let bootTimeouts = [];

        const sleep = ms => new Promise(r => { const id = setTimeout(r, ms); bootTimeouts.push(id); });

        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        const sysAudio = {
            playTone(freq, type, duration, vol=0.1, glideFreq=null) {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type; 
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    if(glideFreq) osc.frequency.exponentialRampToValueAtTime(glideFreq, audioCtx.currentTime + duration);
                    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + duration);
                } catch(e) {}
            },
            noise(duration, vol=0.1) {
                if(!audioCtx) return;
                const bufferSize = audioCtx.sampleRate * duration;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                noise.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            },
            tvOn() { this.playTone(1500, 'sine', 1.0, 0.1, 100); },
            eyeHum() { this.playTone(80, 'sawtooth', 3.5, 0.2); },
            eyeDissolve() { this.noise(1.0, 0.1); this.playTone(400, 'square', 1.0, 0.05, 50); },
            textFade() { this.playTone(600, 'triangle', 1.0, 0.1, 800); },
            slam() { this.playTone(100, 'square', 0.4, 0.5, 40); this.noise(0.2, 0.2); },
            type() {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'square'; osc.frequency.setValueAtTime(Math.random() * 200 + 1200, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.02);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.02);
                } catch(e) {}
            },
            skip() {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } catch(e) {}
            }
        };

        document.body.addEventListener('pointerdown', () => {
            if(!audioCtx || audioCtx.state === 'suspended') {
                initAudio();
            }
        }, { once: true });

        // Overlay di blocco per autorizzare l'AudioContext
        const bootOverlay = document.createElement('div');
        bootOverlay.id = 'tap-to-boot-overlay';
        bootOverlay.style.position = 'fixed';
        bootOverlay.style.inset = '0';
        bootOverlay.style.zIndex = '999999';
        bootOverlay.style.background = 'var(--bg-color)';
        bootOverlay.style.display = 'flex';
        bootOverlay.style.justifyContent = 'center';
        bootOverlay.style.alignItems = 'center';
        bootOverlay.style.cursor = 'pointer';
        bootOverlay.innerHTML = '<div style="font-size: clamp(2rem, 5vw, 4rem); text-shadow: 0 0 20px var(--ph-main); animation: blink 1.5s infinite; text-align: center;">> TAP TO BOOT SYSTEM <</div>';
        document.body.appendChild(bootOverlay);

        bootOverlay.addEventListener('pointerdown', () => {
            bootOverlay.remove(); // Rimuove la barriera
            initAudio(); // Risveglia il contesto audio in modo sicuro
            runBootSequence(); // Avvia l'animazione e la sinfonia fosforosa
        });

        async function runBootSequence() {
            sysAudio.tvOn();
            await sleep(800); if (isSkipped) return;
            document.getElementById('tv-turn-on').style.display = 'none';

            sysAudio.eyeHum();
            const eye = document.getElementById('eye-container');
            eye.style.opacity = '1';
            
            await sleep(2500); if (isSkipped) return;

            sysAudio.eyeDissolve();
            eye.style.opacity = '0';

            await sleep(500); if (isSkipped) return;

            sysAudio.textFade();
            document.getElementById('top-title').style.opacity = '1';

            await sleep(500); if (isSkipped) return;

            const chars = ['c1', 'c2', 'c3', 'c4'];
            for (let id of chars) {
                document.getElementById(id).classList.add('slam');
                sysAudio.slam();
                await sleep(300); if (isSkipped) return;
            }

            await sleep(500); if (isSkipped) return;

            document.getElementById('text-sequence').style.transform = 'translateY(-5vh) scale(0.8)';
            
            const boot2 = document.getElementById('boot2-screen');
            boot2.style.display = 'flex';
            
            const lines = I18N[currentLang].narrative;
            const output = document.getElementById('boot2-text');
            output.innerHTML = "";
            
            await sleep(500); if(isSkipped) return;

            for(let line of lines) {
                if(isSkipped) return;
                
                for (let i = 0; i < line.length; i++) {
                    if(isSkipped) return;
                    
                    output.innerHTML += line.charAt(i);
                    if (line.charAt(i) !== ' ') sysAudio.type();
                    
                    await sleep(20); 
                }
                
                await sleep(400); 
                if(isSkipped) return;
                
                output.innerHTML += '<br>';
                boot2.scrollTop = boot2.scrollHeight; 
            }
            
            if(!isSkipped) {
                await sleep(1500);
                showMenu();
            }
        }

        function skipSequence() {
            isSkipped = true;
            if(audioCtx) sysAudio.skip();
            
            bootTimeouts.forEach(clearTimeout);
            showMenu();
        }

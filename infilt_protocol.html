        function createLangButtons() {
            const container = document.getElementById('lang-container');
            container.innerHTML = '';

                const btn = document.createElement('button');
                btn.className = `lang-btn ${lang === currentLang ? 'active' : ''}`;
                btn.textContent = langCodes[lang];
                btn.onclick = () => {
                    playSFX('click');
                    currentLang = AOE_PROGRESS.setLang(lang);

                    updateLanguageTexts();
                };
                container.appendChild(btn);
            });
        }

        function updateLanguageTexts() {
            const t = LANG_TEXTS[currentLang];
            document.getElementById('start-btn').textContent = t.enter;
            document.getElementById('subtitle').textContent = t.subtitle;
        }

        function proceedToGame() {
            playSFX('click');
            clearInterval(homeMatrix.interval); 
            gameMatrix = createMatrix('matrix-bg-game');

            document.getElementById("home").style.display = "none";
            document.getElementById("game-screen").style.display = "flex";
            
            initGame();

        let audioCtx;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('sound-btn');
            if (soundEnabled) {
                btn.textContent = "[🔊 ON]";
                initAudio();
                playSFX('click');
            } else {
                btn.textContent = "[🔇 OFF]";
            }
        }

        function playSFX(type) {
            if (!soundEnabled || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch (type) {
                case 'hover':
                    osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                    break;
                case 'click':
                    osc.type = 'square'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                    break;
                case 'type':
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(800 + Math.random() * 200, now);
                    gain.gain.setValueAtTime(0.02, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.start(now); osc.stop(now + 0.04);
                    break;
                case 'collect':
                    osc.type = 'sine'; osc.frequency.setValueAtTime(880, now); osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1); 
                    gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                    break;
                case 'hit':
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                    break;
                case 'win':
                    osc.type = 'square'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554.37, now + 0.1); 
                    osc.frequency.setValueAtTime(659.25, now + 0.2); osc.frequency.setValueAtTime(880, now + 0.3);    
                    gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now + 0.6);
                    osc.start(now); osc.stop(now + 0.6);
                    break;
            }
        }

        function createMatrix(id) {
            const canvas = document.getElementById(id);
            const ctx = canvas.getContext('2d');
            let drops = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const columns = Math.floor(window.innerWidth / 14) + 1;
                while(drops.length < columns) { drops.push(Math.random() * -100); }
            }
            resize();
            window.addEventListener('resize', resize);
            window.addEventListener('orientationchange', () => setTimeout(resize, 200));

            const MATRIX_CHARS = "01アイウエオカキクケコハヒフヘホ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

            function draw() {
                ctx.fillStyle = 'rgba(0,0,0,0.085)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = '15px monospace';
                
                for (let i = 0; i < drops.length; i++) {
                    const text = MATRIX_CHARS[Math.floor(Math.random() * MATRIX_CHARS.length)];
                    ctx.fillStyle = '#00ff41'; 
                    ctx.fillText(text, i * 14, drops[i] * 15);
                    if (drops[i] * 15 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            return { interval: setInterval(draw, 75), resize };
        }

        function getSafePosition(startX, startY, r) {
            if (!isEntityColliding(startX, startY, r)) return {x: startX, y: startY};

            for (let i = 0; i < 500; i++) {
                let testX = startX + Math.cos(angle) * radius; let testY = startY + Math.sin(angle) * radius;
                if (!isEntityColliding(testX, testY, r)) return {x: testX, y: testY};
                angle += 0.8; radius += 1.5;   
            }
            return {x: startX, y: startY};

        function handleMapMovement(dt) {
            let kx = 0, ky = 0;
            if (keys['a'] || keys['A'] || keys['ArrowLeft']) kx -= 1;
            if (keys['d'] || keys['D'] || keys['ArrowRight']) kx += 1;
            if (keys['w'] || keys['W'] || keys['ArrowUp']) ky -= 1;
            if (keys['s'] || keys['S'] || keys['ArrowDown']) ky += 1;

            let moveX = kx !== 0 ? kx : joyX;
            let moveY = ky !== 0 ? ky : joyY;

            const mag = Math.hypot(moveX, moveY);
            let isMoving = (mag > 0.1);

            if (isMoving && !wasMoving) { TerminalHack.add(`SCANNING_GEO_REGION...`); }
            wasMoving = isMoving;

            if (isMoving) {
                if (mag > 1) { moveX /= mag; moveY /= mag; }

        function handleMovement(dt) {
            let kx = 0, ky = 0;
            if (keys['a'] || keys['A'] || keys['ArrowLeft']) kx -= 1;
            if (keys['d'] || keys['D'] || keys['ArrowRight']) kx += 1;
            if (keys['w'] || keys['W'] || keys['ArrowUp']) ky -= 1;
            if (keys['s'] || keys['S'] || keys['ArrowDown']) ky += 1;

            let moveX = kx !== 0 ? kx : joyX;
            let moveY = ky !== 0 ? ky : joyY;

            const mag = Math.hypot(moveX, moveY);
            let isMoving = (mag > 0.1);

            if (isMoving && !wasMoving) { TerminalHack.add(`EXEC .\\nav_protocol.sh --override`); } 
            else if (!isMoving && wasMoving) { TerminalHack.add("SYS.HALT() --awaiting_cmd"); }
            wasMoving = isMoving;
            
            if (isMoving) {
                const moveStep = robot.speed * dt;
                if (mag > 1) { moveX /= mag; moveY /= mag; }

                robot.x += moveX * moveStep;
                if (checkWallCollision()) robot.x -= moveX * moveStep;

                robot.y += moveY * moveStep;
                if (checkWallCollision()) robot.y -= moveY * moveStep;

                if(Math.random() > 0.4) robot.trail.push({x: robot.x, y: robot.y, life: 1.0});
            }
            
            robot.trail.forEach((t, i) => { t.life -= dt * 3; if(t.life <= 0) robot.trail.splice(i, 1); });

            robot.x = Math.max(robot.size / 2, Math.min(WIDTH - robot.size / 2, robot.x));
            robot.y = Math.max(280 + robot.size / 2, Math.min(HEIGHT - 70 - robot.size / 2, robot.y));
        }

        function updateEnemies(dt) {
            enemies.forEach(e => {
                const dx = robot.x - e.x, dy = robot.y - e.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 0) {
                    const r = 12; const step = e.speed * dt;
                    let moveAngle = Math.atan2(dy, dx); let moved = false;
                    const anglesToTry = [0, 0.35, -0.35, 0.7, -0.7, 1.05, -1.05, 1.57, -1.57]; 

                    for (let offset of anglesToTry) {
                        let testAngle = moveAngle + offset;
                        let vx = Math.cos(testAngle) * step; let vy = Math.sin(testAngle) * step;
                        if (!isEntityColliding(e.x + vx, e.y + vy, r)) {
                            e.x += vx; e.y += vy; moved = true; break; 
                        }
                    }
                    if (!moved) { e.x += (Math.random() - 0.5) * 3; e.y += (Math.random() - 0.5) * 3; }
                }
            });
        }

        function drawHackerOverlay() {
            gCtx.fillStyle = overlayColor; gCtx.shadowColor = overlayColor; gCtx.shadowBlur = 5; 
            const pixelSize = 10; 
            const artW = currentOverlayArt[0].length * pixelSize; const artH = currentOverlayArt.length * pixelSize;
            const startX = WIDTH / 2 - artW / 2; const startY = HEIGHT / 2 - artH / 2 - 80;
            let linesPerSec = 5; let linesToDraw = Math.min(currentOverlayArt.length, Math.floor(overlayTimer * linesPerSec));

            for (let r = 0; r < linesToDraw; r++) {
                for (let c = 0; c < currentOverlayArt[r].length; c++) {
                    if (currentOverlayArt[r][c] === "X" || currentOverlayArt[r][c] === "█") {
                        gCtx.fillRect(startX + c * pixelSize, startY + r * pixelSize, pixelSize - 1, pixelSize - 1);
                    }
                }
            }
            gCtx.shadowBlur = 0;
            gCtx.font = "34px VT323, monospace"; gCtx.textAlign = "center"; gCtx.textBaseline = "top";
            
            let lines = overlayTyped.split('\n'); let textY = startY + artH + 40;
            for(let i = 0; i < lines.length; i++) { gCtx.fillText(lines[i], WIDTH / 2, textY + i * 45); }

            let animationDuration = currentOverlayArt.length / linesPerSec;
            if (overlayTimer > animationDuration + 0.5 && (!canContinue || Math.floor(overlayTimer * 2) % 2 === 0)) {
                let lastLine = lines.length > 0 ? lines[lines.length - 1] : "";
                let textWidth = gCtx.measureText(lastLine).width;
                gCtx.fillText("█", WIDTH / 2 + textWidth / 2 + 15, textY + Math.max(0, lines.length - 1) * 45);
            }
        }

        function drawMap() {
            gCtx.fillStyle = "#001a0f"; gCtx.fillRect(0, 0, WIDTH, 280); gCtx.strokeStyle = "#003322"; gCtx.lineWidth = 3; gCtx.strokeRect(20, 20, WIDTH - 40, 240);
            let hoveredCity = null;
            cities.forEach(c => {
                const isCompleted = completedCities.includes(c.id);
                const isHovered = gameState === "MAP" && Math.hypot(mapCursor.x - c.x, mapCursor.y - c.y) < 30;
                if(isHovered) hoveredCity = c;
                gCtx.fillStyle = isCompleted ? "#00ffaa" : "#00ff41"; gCtx.shadowBlur = isHovered ? 15 : 5; gCtx.shadowColor = isCompleted ? "#00ffaa" : "#00ff41";
                gCtx.beginPath(); gCtx.arc(c.x, c.y, isHovered ? 16 : 13, 0, Math.PI * 2); gCtx.fill(); gCtx.shadowBlur = 0;
                gCtx.font = "19px VT323, monospace"; gCtx.fillStyle = isCompleted ? "#00ffaa" : "#00ff41";
                let labelX = c.x + 28; if (c.x > 800) labelX = c.x - 165;
                gCtx.fillText(c.name, labelX, c.y + 6);
            });

            if (gameState === "MAP") {
                gCtx.strokeStyle = hoveredCity ? "#fff" : "rgba(0, 255, 65, 0.7)"; gCtx.lineWidth = 2;
                gCtx.beginPath(); gCtx.arc(mapCursor.x, mapCursor.y, 22, 0, Math.PI * 2); gCtx.stroke();
                gCtx.beginPath();
                gCtx.moveTo(mapCursor.x - 30, mapCursor.y); gCtx.lineTo(mapCursor.x - 12, mapCursor.y);
                gCtx.moveTo(mapCursor.x + 12, mapCursor.y); gCtx.lineTo(mapCursor.x + 30, mapCursor.y);
                gCtx.moveTo(mapCursor.x, mapCursor.y - 30); gCtx.lineTo(mapCursor.x, mapCursor.y - 12);
                gCtx.moveTo(mapCursor.x, mapCursor.y + 12); gCtx.lineTo(mapCursor.x, mapCursor.y + 30);
                gCtx.stroke();
            }
        }

        function drawLabyrinth() {
            gCtx.fillStyle = "#001a0f"; gCtx.fillRect(0, 280, WIDTH, HEIGHT - 280);
            robot.trail.forEach(t => { gCtx.globalAlpha = Math.max(0, t.life * 0.5); gCtx.fillStyle = "#00ff80"; gCtx.fillRect(t.x - 8, t.y - 8, 16, 16); });
            gCtx.globalAlpha = 1.0; gCtx.fillStyle = "#00ff41"; walls.forEach(w => gCtx.fillRect(...w));
            gCtx.fillStyle = "#ffff00";
            objectives.forEach(o => {
                if (!o.collected) {
                    gCtx.beginPath(); gCtx.arc(o.x, o.y, 11, 0, Math.PI * 2); gCtx.fill();
                    gCtx.globalAlpha = 0.4; gCtx.beginPath(); gCtx.arc(o.x, o.y, 16, 0, Math.PI * 2); gCtx.fill(); gCtx.globalAlpha = 1.0;
                }
            });
            gCtx.fillStyle = "#ff0044";
            enemies.forEach(e => {
                gCtx.fillRect(e.x - 13, e.y - 13, 26, 26);
                gCtx.globalAlpha = 0.3; gCtx.fillRect(e.x - 18, e.y - 18, 36, 36); gCtx.globalAlpha = 1.0;
            });
            gCtx.fillStyle = "#00ff80"; gCtx.fillRect(robot.x - 13, robot.y - 13, 26, 26);
            gCtx.globalAlpha = 0.3; gCtx.fillRect(robot.x - 18, robot.y - 18, 36, 36); gCtx.globalAlpha = 1.0;
        }

        function updateHUD() {
            const t = LANG_TEXTS[currentLang];
            if (currentCity) {
                document.getElementById('hud-city').textContent = `${t.cityLabel}: ${currentCity.name} | ${t.levelLabel}: ${currentCity.level}`;
                document.getElementById('hud-objectives').textContent = `${t.dataLabel}: ${collected}/${objectives.length}`;
                if (gameState === "LABYRINTH") document.getElementById('hud-status').textContent = `STATUS: ${t.statusInfiltration}`;
                else if (gameState === "HIT") document.getElementById('hud-status').textContent = `STATUS: ${t.statusHit}`;
                else if (gameState === "COMPLETE") document.getElementById('hud-status').textContent = `STATUS: ${t.statusComplete}`;
                else if (gameState === "INTRO") document.getElementById('hud-status').textContent = `STATUS: BOOTING...`;
                updateGeoTracker(); 
            } else {
                let hovered = null;
                if (gameState === "MAP") {
                    for (let c of cities) {
                        if (Math.hypot(mapCursor.x - c.x, mapCursor.y - c.y) < 30) { hovered = c; break; }
                    }
                }
                if (completedCities.length >= cities.length) {
                    document.getElementById('hud-city').textContent = `MISSION: INFILTRATE THE CORE`;
                    document.getElementById('hud-status').textContent = `STATUS: CRITICAL`;
                } else {
                    document.getElementById('hud-city').textContent = hovered ? `${t.cityLabel}: ${hovered.name}` : `${t.cityLabel}: -`;
                    document.getElementById('hud-status').textContent = `STATUS: ${t.statusMap}`;
                }
                document.getElementById('hud-objectives').textContent = `${t.dataLabel}: 0/0`;
                document.getElementById('hud-geo').textContent = `GEO: OFFLINE`;
            }
        }

        window.addEventListener('keydown', e => { keys[e.key] = true; handleActionKey(e.key); });
        window.addEventListener('keyup', e => keys[e.key] = false);

        createLangButtons();
        updateLanguageTexts();
        document.getElementById('sound-btn').textContent = soundEnabled ? "[🔊 ON]" : "[🔇 OFF]";
        window.addEventListener('load', () => {
            document.getElementById('sound-btn').textContent = soundEnabled ? "[🔊 ON]" : "[🔇 OFF]";
        });
	</script>

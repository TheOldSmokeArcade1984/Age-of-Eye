    }

    function playDrawSound() { if(!audioEnabled) return; let step = 0; let interval = setInterval(() => { playTone(150 + Math.random()*150, 'sawtooth', 0.05, 0.01); step++; if(step >= 40) clearInterval(interval); }, 100); }
    function playPowerUp() { if (!audioEnabled) return; try { if (!audioCtx) audioCtx = new AudioContext(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 2); gain.gain.setValueAtTime(0, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.5); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2.5); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 2.5); } catch(e) {} }
    function playPowerDown() { if (!audioEnabled) return; try { if (!audioCtx) audioCtx = new AudioContext(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 1.5); gain.gain.setValueAtTime(0.03, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 1.5); } catch(e) {} }

    function log(key, param = '') { logHistory.push({ key, param }); renderLogs(); }
    function renderLogs() { consoleEl.innerHTML = ''; logHistory.forEach(entry => { const line = document.createElement('span'); line.className = 'console-line'; line.textContent = `> ${i18n[currentLang][entry.key]}${entry.param}`; consoleEl.appendChild(line); }); consoleEl.scrollTop = consoleEl.scrollHeight; }
    function setStatus(key) { currentStatusKey = key; statusEl.textContent = i18n[currentLang][currentStatusKey]; }
    function setMode(key) { currentModeKey = key; modeEl.textContent = i18n[currentLang][currentModeKey]; }
    
    function setTexts() { 
        btnLang.textContent = "◄ " + i18n[currentLang].lang_label + " ►"; 
        btnDiff.textContent = "◄ " + i18n[currentLang][diffKeys[diffIndex]] + " ►"; 
        btnAudio.textContent = audioEnabled ? i18n[currentLang].snd_on : i18n[currentLang].snd_off; 
        rebootBtn.textContent = i18n[currentLang].reboot; 
    }
    
    function toggleLang() { langIndex = (langIndex + 1) % langsArray.length; currentLang = AOE_PROGRESS.setLang(langsArray[langIndex]); setTexts(); setStatus(currentStatusKey); setMode(currentModeKey); renderLogs(); playTone(600, 'square', 0.1); }
    function toggleDiff() { diffIndex = (diffIndex + 1) % 3; setTexts(); log('lvl_msg', i18n[currentLang][diffKeys[diffIndex]].split(': ')[1]); playTone(500 + (diffIndex * 150), 'square', 0.1); }
    function toggleAudio() { audioEnabled = !audioEnabled; btnAudio.textContent = audioEnabled ? i18n[currentLang].snd_on : i18n[currentLang].snd_off; btnAudio.classList.toggle('active-btn', audioEnabled); if(audioEnabled) playTone(880, 'sine', 0.2); }
    
    function init() { grid.innerHTML = ''; for (let i = 0; i < 9; i++) { const cell = document.createElement('div'); cell.className = 'cell'; cell.onclick = () => userMove(i); grid.appendChild(cell); } setTexts(); log('init'); log('lvl_msg', i18n[currentLang][diffKeys[diffIndex]].split(': ')[1]); log('wait'); setStatus('status_standby'); setMode('mode_2d'); grid.classList.add('interactive'); }
    function setActiveLine(id) { document.querySelectorAll('.code-line').forEach(l => l.classList.remove('active')); const el = document.getElementById('code-' + id); if(el) el.classList.add('active'); }

    async function userMove(i) {
        if (!active || board[i]) return;
        board[i] = 'X'; active = false; grid.classList.remove('interactive'); playTone(1200, 'square', 0.1); setActiveLine(4); log('log_u', i);
        grid.children[i].innerHTML = SVG_X; grid.children[i].classList.add('taken'); playDrawSound();
        await new Promise(r => setTimeout(r, 400)); 
        setStatus('status_draw_ai'); document.body.classList.add('in-3d'); grid.classList.add('is-3d'); setMode('mode_3d'); playPowerUp();
        
        await new Promise(r => setTimeout(r, 3500)); 
        if (checkWin(board, 'X')) { document.body.classList.remove('in-3d'); grid.classList.remove('is-3d'); setMode('mode_2d'); playPowerDown();
if (typeof AOE_PROGRESS !== 'undefined') AOE_PROGRESS.markComplete('sector');
 finish('status_u_win'); return; }
        if (!board.includes(null)) { 
            document.body.classList.remove('in-3d'); grid.classList.remove('is-3d'); setMode('mode_2d'); playPowerDown(); 
            if (typeof AOE_PROGRESS !== 'undefined') AOE_PROGRESS.markComplete('sector');
            finish('status_tie'); 
            return; 
        }
        document.body.classList.remove('in-3d'); grid.classList.remove('is-3d'); setMode('mode_2d'); setStatus('status_ret'); playPowerDown();
        await new Promise(r => setTimeout(r, 2000)); 
        aiMove(); 
    }

    async function aiMove() {
        setStatus('status_standby'); setActiveLine(7); playTone(300, 'square', 0.1); await new Promise(r => setTimeout(r, 600)); 
        setActiveLine(9); playTone(350, 'square', 0.1); await new Promise(r => setTimeout(r, 600)); setActiveLine(2); playTone(300, 'square', 0.2);
        const avail = []; for (let j = 0; j < 9; j++) if (board[j] === null) avail.push(j);
        let best; if (Math.random() > diffProbs[diffIndex] && avail.length > 0) { best = avail[Math.floor(Math.random() * avail.length)]; } else { best = minimax(board, 'O').index; }
        board[best] = 'O'; await new Promise(r => setTimeout(r, 600)); setActiveLine(11); playTone(400, 'square', 0.15); await new Promise(r => setTimeout(r, 800)); 
        log('log_ai', best); grid.children[best].innerHTML = SVG_O; grid.children[best].classList.add('taken'); playDrawSound();
        await new Promise(r => setTimeout(r, 400));
        setStatus('status_draw_ai'); document.body.classList.add('in-3d'); grid.classList.add('is-3d'); setMode('mode_3d'); playPowerUp();
        
        await new Promise(r => setTimeout(r, 3500));
        if (checkWin(board, 'O')) { document.body.classList.remove('in-3d'); grid.classList.remove('is-3d'); setMode('mode_2d'); playPowerDown(); finish('status_ai_win'); return; }
        if (!board.includes(null)) { 
            document.body.classList.remove('in-3d'); grid.classList.remove('is-3d'); setMode('mode_2d'); playPowerDown(); 
            if (typeof AOE_PROGRESS !== 'undefined') AOE_PROGRESS.markComplete('sector');
            finish('status_tie'); 
            return; 
        }
        document.body.classList.remove('in-3d'); grid.classList.remove('is-3d'); setMode('mode_2d'); setStatus('status_ret'); playPowerDown();
        await new Promise(r => setTimeout(r, 2000)); setStatus('status_standby'); setActiveLine(1); active = true; grid.classList.add('interactive'); 
    }

    function checkWin(b, p) { for (let w = 0; w < 8; w++) if (b[WIN_PATTERNS[w][0]] === p && b[WIN_PATTERNS[w][1]] === p && b[WIN_PATTERNS[w][2]] === p) return true; return false; }
    
    function minimax(newBoard, player) {
        if (checkWin(newBoard, 'X')) return {score: -10}; if (checkWin(newBoard, 'O')) return {score: 10};
        const avail = []; for (let j = 0; j < 9; j++) if (newBoard[j] === null) avail.push(j);
        if (avail.length === 0) return {score: 0};
        const moves = [];
        for (let i = 0; i < avail.length; i++) { const move = { index: avail[i] }; newBoard[avail[i]] = player; move.score = minimax(newBoard, player === 'O' ? 'X' : 'O').score; newBoard[avail[i]] = null; moves.push(move); }
        let bestMove;
        if (player === 'O') { let bestScore = -10000; for (let i = 0; i < moves.length; i++) if (moves[i].score > bestScore) { bestScore = moves[i].score; bestMove = i; } } 
        else { let bestScore = 10000; for (let i = 0; i < moves.length; i++) if (moves[i].score < bestScore) { bestScore = moves[i].score; bestMove = i; } }
        return moves[bestMove];
    }

    function finish(key) { log(key); setStatus(key); setActiveLine(6); playTone(100, 'sawtooth', 1, 0.05); rebootBtn.classList.remove('hidden'); }
    function reset() { board = Array(9).fill(null); active = true; rebootBtn.classList.add('hidden'); document.body.classList.remove('in-3d'); grid.classList.remove('is-3d'); setMode('mode_2d'); logHistory = []; playTone(800, 'square', 0.2); init(); }

    init();
</script>
